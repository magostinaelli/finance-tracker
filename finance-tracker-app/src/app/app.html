<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-contenido">
      <div class="sidenav-header">
        <h2>Mis Finanzas</h2>
      </div>
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive #r1="routerLinkActive" [activated]="r1.isActive">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/transacciones" routerLinkActive #r2="routerLinkActive" [activated]="r2.isActive">
          <mat-icon matListItemIcon>receipt_long</mat-icon>
          <span matListItemTitle>Transacciones</span>
        </a>
        <a mat-list-item routerLink="/nueva-transaccion" routerLinkActive #r3="routerLinkActive" [activated]="r3.isActive">
          <mat-icon matListItemIcon>add_circle</mat-icon>
          <span matListItemTitle>Nueva Transacción</span>
        </a>
        <a mat-list-item routerLink="/cuentas" routerLinkActive #r4="routerLinkActive" [activated]="r4.isActive">
          <mat-icon matListItemIcon>account_balance_wallet</mat-icon>
          <span matListItemTitle>Cuentas</span>
        </a>
        <a mat-list-item routerLink="/catalogos" routerLinkActive #r5="routerLinkActive" [activated]="r5.isActive">
          <mat-icon matListItemIcon>category</mat-icon>
          <span matListItemTitle>Catálogos</span>
        </a>
        <a mat-list-item routerLink="/cuotas-pendientes" routerLinkActive #r6="routerLinkActive" [activated]="r6.isActive">
          <mat-icon matListItemIcon>payments</mat-icon>
          <span matListItemTitle>Cuotas pendientes</span>
        </a>
      </mat-nav-list>
      <div class="sidenav-footer">
        <button mat-button class="btn-tema" (click)="alternarTema()">
          <mat-icon>{{ esOscuro ? 'light_mode' : 'dark_mode' }}</mat-icon>
          {{ esOscuro ? 'Tema claro' : 'Tema oscuro' }}
        </button>
      </div>
    </div>
  </mat-sidenav>
  <mat-sidenav-content class="main-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
